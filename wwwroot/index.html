<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Test Page</title>
</head>
<body>

    <h1>Welcome</h1>
    <form action="/foo.html" method="GET">
        <button type="submit">Go to the new page</button>
    </form>
    <button onclick="deleteLast()">Delete last symbol</button>

    <script>
        function deleteLast() {
            fetch("/text", { method: "DELETE" });
        }
    </script>
    <br>
    <button onclick="addText()">Add new text in foo.html</button>

    <script>
        function addText() {
            fetch("/text", {
                method: "POST",
                body: "some text to add"
            });
        }
    </script>



</body>
</html>
